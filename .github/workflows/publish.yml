name: Build and publish birthday website

on:
  push:
    branches: [main]
    paths:
      - 'index.source.html'
      - '*.jsx'
      - '*.css'
      - 'music.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: marishalove-publish-v2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Vite source entry
        run: cp index.source.html index.html

      - name: Build website from React source
        run: npx vite build --base=./ --assetsDir=.

      - name: Verify that the birthday letter is in the built site
        shell: bash
        run: |
          test -f dist/index.html
          grep -qF 'Я очень рад, что ты появилась в моей жизни' dist/index-*.js
          grep -qF 'надеюсь, сегодня увидимся с тобой' dist/index-*.js
          grep -qF 'type="module"' dist/index.html

      - name: Publish built files to GitHub Pages root
        id: publish
        shell: bash
        run: |
          git rm -f --ignore-unmatch index-*.js index-*.css
          cp dist/index.html ./index.html
          cp dist/index-*.js dist/index-*.css ./
          touch .nojekyll
          git add -A -- index.html .nojekyll 'index-*.js' 'index-*.css'
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Publish verified React website"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Request GitHub Pages to deploy the generated files
        if: steps.publish.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --show-error --location \
            --output /tmp/pages-build.json --write-out "%{http_code}" \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds")
          echo "Pages build request: HTTP $status"
          cat /tmp/pages-build.json
          test "$status" = "201"
