name: Build and publish birthday website

on:
  push:
    branches: [main]
    paths:
      - '**.jsx'
      - '**.css'
      - 'music.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-website
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        run: npx vite build --base=./ --assetsDir=.

      - name: Update published files
        run: |
          cp dist/index.html ./index.html
          cp dist/index-*.js dist/index-*.css ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index-*.js index-*.css
          if ! git diff --cached --quiet; then
            git commit -m "Publish updated birthday website"
            git push
          fi
